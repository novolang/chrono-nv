[package]
name        = "chrono-nv"
version     = "0.0.2"
description = "The half of a date library that asks the machine: the wall clock, today, the host's UTC offset, a monotonic reading that no clock change can move, deadlines and timers — all of it over calendar-nv's civil types, with every effect row saying which of the two questions a call is asking."
license     = "Apache-2.0"

# An INTERFACE release: every `pub fn` body is a `todo()`, so the
# signatures and the effect rows are published and nothing is
# implemented.  `novo pkg publish` recognises the shape and requires
# both the draft stability and the 0.0.x version; the first
# implementation is the 0.1.0 published over it.
stability   = "draft"

# `host`, and everything effectful in the split lives here.  The rows
# are the disclosure and they are not all the same: reading a clock is
# `[time]`, and reading the host's zone out of the environment is
# `[time, io]`, because `[io]` covers the environment (SPEC § 5.1) and
# a caller in a sandbox that grants one and not the other can see the
# difference before they call.
layer       = "host"

category    = "time"

tags        = ["clock", "time", "monotonic", "deadline", "timer", "timezone", "chrono"]
repository  = "https://github.com/novolang/chrono-nv"
maintainers = ["novo-lang"]

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Asking the machine what time it is"

[dependencies]
# The `core` half of the split, and the only dependency.  A `host`
# package may depend on a `core` one — the shard audit's `dep-layer`
# row is what checks that — and this direction is the whole point of
# the split: the arithmetic is testable with no clock in the room.
calendar-nv = "^0.0.1"
